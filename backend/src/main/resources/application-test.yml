spring:
  datasource:
    url: jdbc:h2:mem:cybershield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

cybershield:
  storage:
    upload-dir: ./target/test-uploads

logging:
  level:
    root: INFO
    com.cybershield: INFO
